include hyde.conf

# Minimal Tab bar styling 
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no
map ctrl+backspace send_text all \x17
allow_remote_control yes
confirm_os_window_close 0

# Enable remote control
allow_remote_control yes
listen_on unix:/tmp/mykitty

# Graphite Mono tab colors
active_tab_background #e0e0e0
active_tab_foreground #1d1d1d
inactive_tab_background #5a5a5a
inactive_tab_foreground #e0e0e0
tab_bar_background #3a3a3a
