bind = SUPER, grave, exec, ~/Scripts/rofi-perplexity.sh
bind = SUPER SHIFT,k,exec,~/.local/lib/hyde/keybinds_hint.sh
bind = SUPER SHIFT,h,exec,dpms-off

# VLC Controls (SHIFT + Function Keys)
bind = SHIFT, F5, exec, playerctl --player=vlc play-pause
bind = SHIFT, F6, exec, playerctl --player=vlc previous
bind = SHIFT, F7, exec, playerctl --player=vlc next
bind = SHIFT, F8, exec, playerctl --player=vlc volume 0.05- 
bind = SHIFT, F9, exec, playerctl --player=vlc volume 0.05+
bind = SHIFT, F10, exec, playerctl --player=vlc position 5-
bind = SHIFT, F11, exec, playerctl --player=vlc position 5+

# Spotify Controls (CTRL + Function Keys)
bind = CTRL, F5, exec, playerctl --player=spotify play-pause
bind = CTRL, F6, exec, playerctl --player=spotify previous
bind = CTRL, F7, exec, playerctl --player=spotify next
bind = CTRL, F8, exec, playerctl --player=spotify volume 0.05-
bind = CTRL, F9, exec, playerctl --player=spotify volume 0.05+
bind = CTRL, F10, exec, playerctl --player=spotify position 5-
bind = CTRL, F11, exec, playerctl --player=spotify position 5+

# Workspace definitions
windowrulev2 = workspace special:goonspace silent, class:^(firefox)$
windowrulev2 = workspace special:discordspace silent, class:^([Vv]esktop)$
windowrulev2 = workspace special:musicspace silent, class:^(spotify)$

# Window rules for fullscreen on spawn
windowrule = fullscreen, class:^(firefox)$
windowrule = fullscreen, class:^(vesktop)$
windowrule = fullscreen, class:^(spotify)$

# Alternative: Use fakefullscreen if you want to keep gaps/decorations
# windowrule = fakefullscreen, class:^(firefox)$
# windowrule = fakefullscreen, class:^(vesktop)$
# windowrule = fakefullscreen, class:^(spotify)$

# Firefox / Goonspace
# Open workspace: Super + Alt + E
bind = SUPER ALT, E, togglespecialworkspace, goonspace
# Move window to workspace: Super + Alt + Shift + E
bind = SUPER ALT SHIFT, E, movetoworkspace, special:goonspace

# Vesktop / Discordspace
# Open workspace: Super + Alt + D
bind = SUPER ALT, D, togglespecialworkspace, discordspace
# Move window to workspace: Super + Alt + Shift + D
bind = SUPER ALT SHIFT, D, movetoworkspace, special:discordspace

# Spotify / Musicspace
# Open workspace: Super + Alt + M
bind = SUPER ALT, M, togglespecialworkspace, musicspace
# Move window to workspace: Super + Alt + Shift + M
bind = SUPER ALT SHIFT, M, movetoworkspace, special:musicspace
bind = SUPER SHIFT, H,exec,hyprctl dispatch dpms ocf
